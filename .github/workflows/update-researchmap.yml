name: Update researchmap data

on:
  schedule:
    - cron: "0 18 * * 0"   # 毎週月曜 3:00(日本時間)
  workflow_dispatch:        # Actionsタブから手動でも実行できる

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch researchmap data
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          ID = "naka_sato"
          TYPES = ["published_papers", "presentations", "books_etc", "misc", "media_coverage"]
          os.makedirs("data", exist_ok=True)
          for t in TYPES:
              items, url = [], f"https://api.researchmap.jp/{ID}/{t}?limit=100"
              while url:
                  req = urllib.request.Request(url, headers={"Accept": "application/json"})
                  with urllib.request.urlopen(req, timeout=60) as r:
                      d = json.load(r)
                  items += d.get("items", [])
                  url = (d.get("_links", {}).get("next") or {}).get("href")
              with open(f"data/{t}.json", "w", encoding="utf-8") as f:
                  json.dump({"items": items}, f, ensure_ascii=False, indent=1)
              print(t, len(items))
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update researchmap data" && git push)
